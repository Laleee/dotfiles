name: Test dotfiles

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fzf shellcheck stow zsh zsh-autosuggestions zsh-syntax-highlighting

      - name: Install test dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck stow

      # The test suite redirects HOME to per-test temporary directories and
      # replaces curl and git remote installers with local test doubles.
      - name: Run isolated tests
        run: bash tests/run.sh

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked lint dependencies
        run: npm ci

      - name: Run Lua and Markdown linters
        run: npm run lint
